[package]
name = "aqua-auth-testkit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "E2E test harness for aqua-auth: AquaPeer, test signers, and the e2e suites. Internal testkit, never published."
# Internal testkit by ruling (2026-08-30): consumers reach it by path or git,
# and its API carries no stability promise.
publish = false

[dependencies]
# The library under test. The harness lib needs `http` (stores, wire types)
# and `http-sig` (verify_request); the `client` feature is added only by the
# dev-dependencies below, so downstream consumers of the testkit do not pull
# reqwest unless they ask for it.
aqua-auth = { path = "..", features = ["http", "http-sig", "did-aqua"] }
aqua-auth-directory = { path = "../aqua-auth-directory" }
async-trait = "0.1"
axum = "0.8"
# The test signers generate real keys and build the DID spellings themselves,
# so the crypto crates are direct dependencies here, pinned to the same
# versions aqua-auth uses.
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
# Same version aqua-auth and aqua-rs-sdk pin, so the testkit signer and the
# verifier can never disagree about what a valid ML-DSA-87 signature is.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
# Optional: only pulled in by the `conformance` feature (default-on). The
# `conformance` module drives an arbitrary base URL over real HTTP, so it
# needs a client and URL parsing as normal (non-dev) dependencies; a consumer
# who wants only the signers can opt out with `default-features = false`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = { version = "2", optional = true }

[features]
default = ["conformance"]
# The base-URL conformance suite. Default-on so `cargo test -p aqua-auth-testkit`
# always compiles it: a suite that silently compiles to zero tests under the
# wrong flags is the failure this crate's manifest already warns about. A
# consumer that wants only the signers can take `default-features = false`.
conformance = ["dep:reqwest", "dep:url"]

[dev-dependencies]
# The e2e suites live here so aqua-auth's own feature-lane matrix stays
# untouched: this crate always has the features its tests need, so no suite
# can silently compile to zero tests under the wrong flags again.
aqua-auth = { path = "..", features = ["client"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
turmoil = "0.7"
tokio = { version = "1", features = ["full"] }
