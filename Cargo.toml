[package]
name = "aqua-auth"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/inblockio/aqua-rs-auth"
description = "DID-based authentication for the Aqua Protocol. Crypto/DID primitives by default; challenge-response sessions behind the `http` feature."

[features]
default = []
http = ["dep:rand", "dep:serde_json", "dep:chrono", "dep:dashmap", "dep:tokio", "dep:tracing"]
client = ["http", "dep:reqwest"]
webauthn = ["dep:sha2", "dep:base64", "dep:serde_json"]

[dependencies]
# Always (crypto layer)
async-trait = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
bs58 = "0.5"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Behind `http` feature
rand = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }
# H2 hardening: loud, structured logging for store-capacity events (e.g.
# SessionStore rejecting a create when full). `tracing` (not `log`) so
# consumers already on a `tracing_subscriber` (aqua-node) capture these
# events automatically with zero bridging.
tracing = { version = "0.1", optional = true }

# Behind `webauthn` feature
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.21", optional = true }

# Behind `client` feature
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
