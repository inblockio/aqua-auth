[package]
name = "aqua-auth"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/inblockio/aqua-rs-auth"
description = "DID-based authentication for the Aqua Protocol. Crypto/DID primitives by default; challenge-response sessions behind the `http` feature."

[features]
default = []
http = ["dep:rand", "dep:serde_json", "dep:chrono", "dep:dashmap", "dep:tokio", "dep:tracing"]
client = ["http", "dep:reqwest"]
webauthn = ["dep:sha2", "dep:base64", "dep:serde_json"]
# `ceremony` adds the register/login WebAuthn ceremony over webauthn-rs. Kept
# separate from `webauthn` so consumers that only VERIFY assertions (the light
# path) don't pull the heavy webauthn-rs stack.
ceremony = ["webauthn", "dep:webauthn-rs", "dep:uuid"]
redis = ["dep:redis", "http"]

[dependencies]
# Always (crypto layer)
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
bs58 = "0.5"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Behind `http` feature
rand = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }
# H2 hardening: loud, structured logging for store-capacity events (e.g.
# SessionStore rejecting a create when full). `tracing` (not `log`) so
# consumers already on a `tracing_subscriber` (aqua-node) capture these
# events automatically with zero bridging.
tracing = { version = "0.1", optional = true }

# Behind `webauthn` feature
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.21", optional = true }

# Behind `ceremony` feature. Pinned to the EXACT version aqua-node/aquafier use
# so the serialized `Passkey` blob (feature `danger-allow-state-serialisation`)
# is byte-compatible across all consumers of the shared credential store.
webauthn-rs = { version = "=0.6.1-dev", features = ["danger-allow-state-serialisation"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Behind `client` feature
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Behind `redis` feature. Sync API only (SessionBackend is a sync trait):
# default features give us `redis::Client` + `get_connection()` (blocking
# `redis::Connection`). Deliberately NOT enabling `tokio-comp`/`aio`/
# `connection-manager` — those are async-only and would need a runtime
# handle inside sync trait methods.
redis = { version = "0.27", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
