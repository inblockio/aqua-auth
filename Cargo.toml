[package]
name = "aqua-auth"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/inblockio/aqua-rs-auth"
description = "DID-based authentication for the Aqua Protocol. Crypto/DID primitives by default; challenge-response sessions behind the `http` feature."

[features]
default = []
http = ["dep:rand", "dep:serde_json", "dep:chrono", "dep:dashmap", "dep:tokio", "dep:tracing"]
client = ["http", "dep:reqwest", "dep:url"]
webauthn = ["dep:sha2", "dep:base64", "dep:serde_json"]
# RFC 9421 per-request HTTP message signatures. EXPERIMENTAL: tracks an IETF
# draft (see `src/http_sig/mod.rs`), so it is exempt from the crate's semver
# stability promise until the draft settles.
http-sig = ["dep:sfv", "dep:base64", "dep:rand", "dep:dashmap"]
# `ceremony` adds the register/login WebAuthn ceremony over webauthn-rs. Kept
# separate from `webauthn` so consumers that only VERIFY assertions (the light
# path) don't pull the heavy webauthn-rs stack.
ceremony = ["webauthn", "dep:webauthn-rs", "dep:uuid"]
# The Redis-backed WebAuthn credential store (`RedisWebauthnStore`), which is
# the only thing this feature now compiles: the Redis *session* backend was
# removed in 0.6.0 (see CHANGELOG). Implies `webauthn` because the credential
# store is gated on it; without that implication `--features redis` would build
# the `redis` crate and expose nothing.
redis = ["dep:redis", "webauthn"]

[dependencies]
# Always (crypto layer)
async-trait = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
bs58 = "0.5"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Behind `http` feature
rand = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }
# H2 hardening: loud, structured logging for store-capacity events (e.g.
# SessionStore rejecting a create when full). `tracing` (not `log`) so
# consumers already on a `tracing_subscriber` (aqua-node) capture these
# events automatically with zero bridging.
tracing = { version = "0.1", optional = true }

# Behind `webauthn` feature
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.21", optional = true }

# Behind `http-sig` feature: RFC 8941 structured field parsing/serialization.
# Hand-rolling structured fields is where RFC 9421 implementations go wrong
# (quoting, escaping, integer canonicalisation), so this is delegated.
sfv = { version = "0.15", optional = true }

# Behind `ceremony` feature. Pinned to the EXACT version aqua-node/aquafier use
# so the serialized `Passkey` blob (feature `danger-allow-state-serialisation`)
# is byte-compatible across all consumers of the shared credential store.
webauthn-rs = { version = "=0.6.1-dev", features = ["danger-allow-state-serialisation"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Behind `client` feature
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Origin comparison for the challenge-binding check. Already in reqwest's
# dependency tree, so this adds no new code to the build.
url = { version = "2", optional = true }

# Behind `redis` feature. Sync API only (WebauthnCredentialBackend is a sync
# trait): default features give us `redis::Client` + `get_connection()`
# (blocking `redis::Connection`). Deliberately NOT enabling `tokio-comp`/`aio`/
# `connection-manager`, which are async-only and would need a runtime handle
# inside sync trait methods.
redis = { version = "0.27", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"

# The root package stays in place and remains the default cargo target here, so
# a bare `cargo test` at the root still means "test aqua-auth". The directory
# crate is a separate 0.x member on purpose: it tracks an IETF draft, and draft
# churn must never force a semver bump on this crate. The testkit member
# (`publish = false`) owns the AquaPeer e2e harness and the e2e suites, so this
# crate's feature-lane matrix stays exactly the published surface.
[workspace]
members = [".", "aqua-auth-directory", "aqua-auth-testkit"]
resolver = "2"
